<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Code Generator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f5f7;
    --card-bg: #ffffff;
    --text: #1d1d1f;
    --muted: #6e6e73;
    --border: #d2d2d7;
    --accent: #0071e3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1e;
      --card-bg: #2c2c2e;
      --text: #f5f5f7;
      --muted: #a1a1a6;
      --border: #3a3a3c;
      --accent: #409cff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 24px;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
  }
  h1 {
    font-size: 1.4rem;
    margin: 0 0 20px;
    text-align: center;
  }
  label {
    display: block;
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 6px;
    margin-top: 16px;
  }
  label:first-of-type { margin-top: 0; }
  textarea, select, input[type="color"] {
    width: 100%;
    font-size: 1rem;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-family: inherit;
    resize: vertical;
  }
  textarea { min-height: 70px; }
  .row {
    display: flex;
    gap: 12px;
  }
  .row > div { flex: 1; }
  input[type="color"] {
    padding: 4px;
    height: 42px;
    cursor: pointer;
  }
  #qrcode {
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 24px 0;
    min-height: 216px;
  }
  #qrcode img, #qrcode canvas {
    border-radius: 8px;
  }
  button {
    width: 100%;
    padding: 12px;
    font-size: 1rem;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: white;
    cursor: pointer;
  }
  button:hover { opacity: 0.9; }
  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .hint {
    text-align: center;
    font-size: 0.75rem;
    color: var(--muted);
    margin-top: 12px;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>QR Code Generator</h1>

    <label for="text">Text or URL</label>
    <textarea id="text" placeholder="Enter text or a URL...">https://example.com</textarea>

    <div class="row">
      <div>
        <label for="size">Size</label>
        <select id="size">
          <option value="128">128 px</option>
          <option value="192">192 px</option>
          <option value="256" selected>256 px</option>
          <option value="384">384 px</option>
          <option value="512">512 px</option>
        </select>
      </div>
      <div>
        <label for="correction">Error correction</label>
        <select id="correction">
          <option value="L">Low</option>
          <option value="M" selected>Medium</option>
          <option value="Q">Quartile</option>
          <option value="H">High</option>
        </select>
      </div>
    </div>

    <div class="row">
      <div>
        <label for="fgColor">Foreground</label>
        <input type="color" id="fgColor" value="#000000">
      </div>
      <div>
        <label for="bgColor">Background</label>
        <input type="color" id="bgColor" value="#ffffff">
      </div>
    </div>

    <div id="qrcode"></div>

    <button id="downloadBtn">Download PNG</button>
    <p class="hint">Generated locally in your browser — nothing is sent to a server.</p>
  </div>

<script>
  const textInput = document.getElementById('text');
  const sizeSelect = document.getElementById('size');
  const correctionSelect = document.getElementById('correction');
  const fgColor = document.getElementById('fgColor');
  const bgColor = document.getElementById('bgColor');
  const qrContainer = document.getElementById('qrcode');
  const downloadBtn = document.getElementById('downloadBtn');

  const correctionLevels = {
    L: QRCode.CorrectLevel.L,
    M: QRCode.CorrectLevel.M,
    Q: QRCode.CorrectLevel.Q,
    H: QRCode.CorrectLevel.H,
  };

  let qrcode = null;
  let debounceTimer = null;

  function render() {
    const value = textInput.value.trim();
    qrContainer.innerHTML = '';
    downloadBtn.disabled = !value;
    if (!value) return;

    qrcode = new QRCode(qrContainer, {
      text: value,
      width: Number(sizeSelect.value),
      height: Number(sizeSelect.value),
      colorDark: fgColor.value,
      colorLight: bgColor.value,
      correctLevel: correctionLevels[correctionSelect.value],
    });
  }

  function scheduleRender() {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(render, 200);
  }

  [textInput, sizeSelect, correctionSelect, fgColor, bgColor].forEach(el => {
    el.addEventListener('input', scheduleRender);
    el.addEventListener('change', scheduleRender);
  });

  downloadBtn.addEventListener('click', () => {
    const canvas = qrContainer.querySelector('canvas');
    const img = qrContainer.querySelector('img');
    const source = canvas || img;
    if (!source) return;

    const link = document.createElement('a');
    link.download = 'qrcode.png';
    link.href = canvas ? canvas.toDataURL('image/png') : img.src;
    link.click();
  });

  render();
</script>
</body>
</html>
